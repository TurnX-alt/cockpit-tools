name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is from main branch
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "ERROR: Release tags must be on the main branch."
            exit 1
          fi
          echo "Branch check passed."

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        shell: bash
        run: |
          npm install -g pnpm@10.26.2
          pnpm config set auto-install-peers true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync versions
        run: pnpm run sync-version

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.app_version.outputs.VERSION }}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" && "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}-"* ]]; then
            echo "Tag (${GITHUB_REF_NAME}) does not match package.json version (${EXPECTED_TAG})."
            echo "Accepted formats: v${VERSION} or v${VERSION}-YYYYMMDD"
            exit 1
          fi

      - name: Build release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.VERSION }}"
          TAG="${GITHUB_REF_NAME}"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## Cockpit Tools $TAG" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Security-hardened fork release by TurnX-alt." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Security Patches" >> "$GITHUB_OUTPUT"
          echo "- Third-party ads removed" >> "$GITHUB_OUTPUT"
          echo "- CSP policy enforced" >> "$GITHUB_OUTPUT"
          echo "- Announcement URL pointed to fork" >> "$GITHUB_OUTPUT"
          echo "- Release workflow hardened" >> "$GITHUB_OUTPUT"
          echo "- Updater signing key rotation" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Upstream" >> "$GITHUB_OUTPUT"
          echo "- Based on jlcodes99/cockpit-tools v$VERSION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cockpit Tools ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false

  publish-release:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false --latest
